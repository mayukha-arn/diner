kind = "web"
previewPath = "/diner-static/"
title = "The Diner (Static)"
version = "1.0.0"
id = "artifacts/diner-static"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/diner-static/" ]
localPort = 19498

[services.development]
run = "pnpm --filter @workspace/diner-static run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diner-static", "run", "build" ]
publicDir = "artifacts/diner-static/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19498"
BASE_PATH = "/diner-static/"
